<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenTuner</title>
<meta name="robots" content="noindex">
<script>
  // O site saiu do GitHub Pages: o mesmo caminho, sem o prefixo /open-tuner,
  // no domínio novo.
  var caminho = location.pathname.replace(/^\/open-tuner(?=\/|$)/, '') || '/';
  location.replace('https://opentuner.libre-apps.org' + caminho + location.search + location.hash);
</script>
</head>
<body>
<p>OpenTuner: <a href="https://opentuner.libre-apps.org/">opentuner.libre-apps.org</a></p>
</body>
</html>
