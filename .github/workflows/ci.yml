# Integração contínua: formatação, análise, testes e build do APK de debug.
#
# Nenhum artefato assinado sai daqui. A chave de release não entra no
# repositório nem nos segredos do GitHub: o APK publicado é gerado e assinado
# na máquina de quem guarda a chave.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo no mesmo PR cancela a rodada anterior, que já não interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fixada para o resultado ser reproduzível: é a versão em que o projeto é
  # desenvolvido.
  FLUTTER_VERSION: "3.38.5"

jobs:
  verificar:
    name: Formatação, análise e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed lib test

      # Os scripts de chave e de release rodam fora do CI, na máquina de quem
      # guarda a chave; aqui só a análise estática deles.
      - name: Scripts
        run: shellcheck tool/*.sh

      # O analisador observa o projeto inteiro por inotify, e o limite padrão
      # de instâncias do runner às vezes não basta: o `flutter analyze` falha
      # com "Too many open files" sem que haja nada errado no código.
      - name: Folga de inotify para o analisador
        run: sudo sysctl -w fs.inotify.max_user_instances=1024

      - name: Análise
        run: flutter analyze

      - name: Testes
        run: flutter test

  apk:
    name: Build do APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build
        run: flutter build apk --debug

      # APK de debug, assinado com a chave de debug descartável do runner.
      # Serve para testar o PR num aparelho, não para distribuir.
      - uses: actions/upload-artifact@v4
        with:
          name: open-tuner-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
